[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "just-alpha101"
version = "0.1.0"
description = "A transparent student research reproduction of 101 Formulaic Alphas"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0,<3", "pandas>=2.2,<3", "scipy>=1.13,<2", "matplotlib>=3.9,<4", "requests>=2.32,<3", "pyarrow>=18", "exchange-calendars>=4.5"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

